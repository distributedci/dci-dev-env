version: "3"

services:
  devenv_ca:
    build: ./devenv-ca
    volumes:
      # Make script live-reusable without rebuilding
      - ./devenv-ca/generate-certs.sh:/generate-certs.sh:ro,Z
      - ./devenv-ca/certs:/certs:z
    healthcheck:
      test: test -f /certs/ca.crt
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: cgr.dev/chainguard/minio
    env_file: .env
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: mc ready local
  createbuckets:
    image: cgr.dev/chainguard/minio
    env_file: .env
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set dciminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb dciminio/${STORE_COMPONENTS_CONTAINER};
      /usr/bin/mc mb dciminio/${STORE_CONTAINER_BUCKET};
      exit 0;
      "
  haproxy:
    image: docker.io/haproxytech/haproxy-alpine:3.0
    depends_on:
      api:
        condition: healthy
      devenv_ca:
        condition: service_healthy
    volumes:
      - ./haproxy:/usr/local/etc/haproxy:ro,Z
      - ./devenv-ca/certs:/certs:ro,z
    ports:
      - "8000:80"
      - "8443:443"
      - "8404:8404"
  db:
    image: quay.io/sclorg/postgresql-16-c9s
    environment:
      - POSTGRESQL_USER=dci
      - POSTGRESQL_PASSWORD=dci
      - POSTGRESQL_DATABASE=dci
    depends_on:
      devenv_ca:
        condition: service_healthy
    volumes:
      - ./dci-db:/opt/app-root/src:Z
      - ./devenv-ca/certs:/certs:ro,z
    tmpfs:
      - /var/lib/pgsql/data
    shm_size: "2gb"
    ports:
      - "5432:5432"
    healthcheck:
      test: pg_isready -d dci -U dci -h db
      interval: 15s
      timeout: 5s
      retries: 5
  redis:
    image: quay.io/sclorg/redis-7-c9s
    depends_on:
      devenv_ca:
        condition: service_healthy
    volumes:
      - ./redis/post-init.sh:/usr/share/container-scripts/redis/post-init.sh:ro,Z
      - ./devenv-ca/certs:/certs:ro,z
    healthcheck:
      test: redis-cli --tls --cacert /certs/ca.crt ping
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
  debug_smtpd:
    image: registry.access.redhat.com/ubi10/python-312-minimal
    entrypoint: >
      /bin/sh -c "
      python3 -m pip install aiosmtpd;
      aiosmtpd -n -l debug_smtpd:8025;
      "
  rabbitmq:
    image: docker.io/library/rabbitmq:latest
    depends_on:
      devenv_ca:
        condition: service_healthy
    volumes:
      - ./devenv-ca/certs:/certs:ro,z
      - ./rabbitmq/tls.conf:/etc/rabbitmq/conf.d/90-tls.conf:z
  api:
    build: ${DCI_GIT_REPO_DIR}/dci-control-server
    depends_on:
      - db
      - minio
      - redis
      - auth_tracking
      - rabbitmq
      - debug_smtpd
    env_file: .env
    volumes:
      - ${DCI_GIT_REPO_DIR}/dci-control-server:/opt/dci-control-server:z
      - ./devenv-ca/certs:/certs:z
    restart: on-failure
    deploy:
      mode: replicated
      replicas: 4
    healthcheck:
      test: curl -sf http://localhost:5000/api/v1
      interval: 15s
      timeout: 5s
      retries: 5
    # Forced to redefine the command below because of entrypoint redefinition below
    command: /usr/local/bin/gunicorn -c /etc/gunicorn.conf.py -b 0.0.0.0:5000 dci.app:create_app()
    entrypoint: /usr/local/sbin/entrypoint-devenv.sh
  auth_tracking:
    image: localhost/dci-dev-env_api:latest
    depends_on:
      devenv_ca:
        condition: service_healthy
      db:
        condition: healthy
      redis:
        condition: healthy
    volumes:
      - ${DCI_GIT_REPO_DIR}/dci-control-server:/opt/dci-control-server:z
      - ./devenv-ca/certs:/certs:z
    env_file: .env
    command: bin/dci-sync-redis-auth --interval 30 --threshold 5
    entrypoint: ""
  tox:
    build: ./dci-tox
    env_file: .env
    privileged: true
    stdin_open: true
    tty: true
    depends_on:
      - haproxy
    volumes:
      - ./devenv-ca/certs:/certs:z
      - ${DCI_GIT_REPO_DIR}/python-dciclient:/opt/python-dciclient:z
      - ${DCI_GIT_REPO_DIR}/python-dciauth:/opt/python-dciauth:z
      - ${DCI_GIT_REPO_DIR}/dci-control-server:/opt/dci-control-server:z
      - ${DCI_GIT_REPO_DIR}/dci-ansible:/opt/dci-ansible:z
      - ${DCI_GIT_REPO_DIR}/dci-feeder-api:/opt/dci-feeder-api:z
      - ${DCI_GIT_REPO_DIR}/dci-umb:/opt/dci-umb:z
      - ${DCI_GIT_REPO_DIR}/dci-analytics:/opt/dci-analytics:z
